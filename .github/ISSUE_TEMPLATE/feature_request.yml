name: Feature request
description: Suggest a useful improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: What problem should this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Include workarounds or other approaches if you have tried them.
    validations:
      required: false
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: How would this help users or contributors?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional links, sketches, or examples. Do not include private data.
    validations:
      required: false
